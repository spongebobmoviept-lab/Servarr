services:
  servarr:
    image: ghcr.io/spongebobmoviept-lab/servarr:1.1.0   # ready-made image (amd64 + arm64)
    # build: https://github.com/spongebobmoviept-lab/Servarr.git#v1.1.0   # build from source instead: uncomment, then `docker compose up -d --build`
    container_name: servarr
    restart: unless-stopped
    # Runs as this uid:gid (the image never runs as root). ./data must be
    # writable by it — create it yourself first: mkdir -p data
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8888:8888"
    env_file:
      - path: .env
        required: false   # optional: everything is set in the web setup page
    volumes:
      - ./data:/data
      # Running the Movie Night player on the same host? Its bundle can share
      # a pairing file so Servarr pairs itself (see the movienight-player
      # README). Otherwise just paste the player's pair code in /setup.
      #   - movienight-pair:/pair:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
