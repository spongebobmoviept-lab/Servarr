services:
  servarr:
    image: ghcr.io/spongebobmoviept-lab/servarr:1.2.0   # ready-made image (amd64 + arm64)
    # build: https://github.com/spongebobmoviept-lab/Servarr.git#v1.2.0   # build from source instead: uncomment, then `docker compose up -d --build`
    container_name: servarr
    restart: unless-stopped
    environment:
      # The app runs as this uid:gid (never as root); ./data is made
      # writable for it automatically on start.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Only want Movie Night (the watch party)? Uncomment this, or pick
      # "Movie Night only" on the setup page. See the README.
      # - SERVARR_MODE=movienight
    ports:
      - "8888:8888"
    env_file:
      - path: .env
        required: false   # optional: everything is set in the web setup page
    volumes:
      - ./data:/data
      # Running the Movie Night player on the same host? Its bundle can share
      # a pairing file so Servarr pairs itself (see the movienight-player
      # README). Otherwise just paste the player's pair code in /setup.
      #   - pairing:/pairing:ro
    healthcheck:
      test: ["CMD", "python", "-m", "app.serve", "--check"]   # follows SERVARR_HOST / SERVARR_PORT
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
